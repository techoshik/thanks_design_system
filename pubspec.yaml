name: thanks_design_system
description: Shared visual foundations and reusable Flutter UI components for Thanks applications.
version: 1.0.4
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  fit_it:
    git: https://github.com/techoshik/fit_it
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans-VariableFont_opsz,wght.ttf
