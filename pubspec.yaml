name: thanks_design_system
description: Shared visual foundations and reusable Flutter UI components for Thanks applications.
version: 1.1.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  fit_it:
    git:
      url: https://github.com/techoshik/fit_it.git
      ref: v0.1.0

  flutter:
    sdk: flutter
  intl: ^0.20.3
  material_ui: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans-VariableFont_opsz,wght.ttf
